<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Créer un compte — IK DIAG</title>
<link rel="stylesheet" href="/assets/css/style.css" />
</head>
<body>
  <div class="auth-shell">
    <div class="auth-card">
      <div class="auth-brand">
        <span class="brand-mark" style="width:44px;height:44px;font-size:16px;">IK</span>
        <div><strong style="font-size:18px;">IK DIAG</strong><br><small class="muted">Réf Technique</small></div>
      </div>
      <h1>Créer un compte</h1>
      <p class="auth-tagline">Vos données de mission restent chiffrées avec votre mot de passe — choisissez-le avec soin, il ne peut pas être récupéré.</p>

      <form id="register-form">
        <div class="field">
          <label for="fullName">Nom complet</label>
          <input type="text" id="fullName" autocomplete="name" required />
        </div>
        <div class="field">
          <label for="username">Identifiant</label>
          <input type="text" id="username" autocomplete="username" required />
        </div>
        <div class="field">
          <label for="password">Mot de passe (8 caractères min.)</label>
          <input type="password" id="password" autocomplete="new-password" minlength="8" required />
        </div>
        <div id="form-error" class="form-error" hidden></div>
        <button type="submit" class="btn btn--block">Créer mon compte</button>
      </form>

      <p class="auth-foot">Déjà inscrit ? <a href="/login.html" style="color:var(--primary);font-weight:600;">Se connecter</a></p>
    </div>
  </div>

  <script type="module">
    import { register, isAuthenticated } from "/assets/js/auth.js";

    if (isAuthenticated()) window.location.href = "/index.html";

    const form = document.getElementById("register-form");
    const errorBox = document.getElementById("form-error");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      errorBox.hidden = true;
      try {
        await register({
          fullName: document.getElementById("fullName").value,
          username: document.getElementById("username").value,
          password: document.getElementById("password").value,
        });
        window.location.href = "/index.html";
      } catch (err) {
        errorBox.textContent = err.message;
        errorBox.hidden = false;
      }
    });
  </script>
</body>
</html>
